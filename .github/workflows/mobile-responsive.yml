name: Mobile responsive
on:
  pull_request:
  push:
    branches: [main]
jobs:
  viewport-safe-areas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: mobile-ui-fixture
      E2E_PRODUCTION_SERVER: "1"
      QA_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e:mobile
      - if: always()
        run: node scripts/collectMobilePwaQa.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-responsive-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-pwa-final-qa
          path: test-results/mobile-pwa-final-qa/
          retention-days: 7
