name: Mobile responsive
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: mobile-ui-fixture
  E2E_PRODUCTION_SERVER: "1"
  QA_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Preserve hidden Next files and the public assets generated by prebuild.
      # The build cache is unnecessary for serving or collecting asset sizes.
      - run: tar --exclude='.next/cache' -czf mobile-build.tar.gz .next public
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-responsive-build
          path: mobile-build.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  mobile-tests:
    name: mobile shard ${{ matrix.shard }}/4
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Keep the other shards running so failures retain complete diagnostics.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@v4
        with:
          name: mobile-responsive-build
      - run: tar -xzf mobile-build.tar.gz
      # Keep both projects, CI workers/retries and every existing assertion.
      - run: npm run test:e2e:mobile -- --shard=${{ matrix.shard }}/4 --reporter=line,blob
      - name: Upload shard blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-responsive-blob-${{ matrix.shard }}
          path: blob-report/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Upload shard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-responsive-results-${{ matrix.shard }}
          path: test-results/
          include-hidden-files: true
          retention-days: 7

  viewport-safe-areas:
    # Run after failed shards too, but stop obsolete runs on a new PR commit.
    if: ${{ !cancelled() }}
    needs: [build, mobile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: mobile-responsive-build
      - run: tar -xzf mobile-build.tar.gz
      - name: Download shard diagnostics
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: mobile-responsive-results-*
          path: test-results/
          # Keep each shard in its own directory, including retries/attachments.
          merge-multiple: false
      - name: Download blob reports
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: mobile-responsive-blob-*
          path: blob-report/
          # Playwright includes the shard index in each blob filename.
          merge-multiple: true
      - name: Merge Playwright reports
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          reports=(blob-report/*.zip)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::No Playwright blob reports available"
            exit 1
          fi
          npx playwright merge-reports --reporter=html blob-report
          if [ "${#reports[@]}" -ne 4 ]; then
            echo "::error::Expected 4 shard reports, found ${#reports[@]}"
            exit 1
          fi
      - name: Collect aggregated mobile PWA QA
        if: always()
        run: node scripts/collectMobilePwaQa.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-responsive-report
          path: |
            test-results/
            playwright-report/
          include-hidden-files: true
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-pwa-final-qa
          path: test-results/mobile-pwa-final-qa/
          retention-days: 7
      # Report merging does not fail just because a test failed. Preserve the
      # required check's failure even when the final QA subset itself is green.
      - name: Require successful build and all shards
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SHARDS_RESULT: ${{ needs.mobile-tests.result }}
        run: |
          if [ "$BUILD_RESULT" != success ] || [ "$SHARDS_RESULT" != success ]; then
            echo "::error::Mobile responsive failed: build=$BUILD_RESULT, shards=$SHARDS_RESULT"
            exit 1
          fi
