name: Social DB security

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "app/api/training/duo/**"
      - "components/training/*Duo*"
      - "lib/trainingDuo*"
      - "lib/server/trainingDuo*"
      - "tests/*DuoInvitation*"
      - "tests/socialDuoNotifications.test.ts"
      - "scripts/testSocialDb.mjs"
      - "scripts/provisionSocialE2e.mjs"
      - "scripts/testSocialPublication.sql"
      - "scripts/testFriendProfile*"
      - "e2e/friendProfile.spec.ts"
      - "app/friends/**"
      - "app/api/social/friends/**"
      - "lib/friendProfile.ts"
      - "lib/friendGameActions.ts"
      - "components/friends/**"
      - "e2e/socialNotifications.spec.ts"
      - "e2e/socialPresence.spec.ts"
      - "components/social/**"
      - "components/friends/FriendsView.tsx"
      - "components/multiplayer/GameInvitationDialog.tsx"
      - "components/AppTopNav.tsx"
      - "app/layout.tsx"
      - "app/globals.css"
      - "app/friends/FriendsPageClient.tsx"
      - "app/api/social/presence/**"
      - "lib/social*.ts"
      - "lib/server/socialService.ts"
      - "lib/friendPresence.ts"
      - ".github/workflows/social-db.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "app/api/training/duo/**"
      - "components/training/*Duo*"
      - "lib/trainingDuo*"
      - "lib/server/trainingDuo*"
      - "tests/*DuoInvitation*"
      - "tests/socialDuoNotifications.test.ts"
      - "scripts/testSocialDb.mjs"
      - "scripts/provisionSocialE2e.mjs"
      - "scripts/testSocialPublication.sql"
      - "scripts/testFriendProfile*"
      - "e2e/friendProfile.spec.ts"
      - "app/friends/**"
      - "app/api/social/friends/**"
      - "lib/friendProfile.ts"
      - "lib/friendGameActions.ts"
      - "components/friends/**"
      - "e2e/socialNotifications.spec.ts"
      - "e2e/socialPresence.spec.ts"
      - "components/social/**"
      - "components/friends/FriendsView.tsx"
      - "components/multiplayer/GameInvitationDialog.tsx"
      - "components/AppTopNav.tsx"
      - "app/layout.tsx"
      - "app/globals.css"
      - "app/friends/FriendsPageClient.tsx"
      - "app/api/social/presence/**"
      - "lib/social*.ts"
      - "lib/server/socialService.ts"
      - "lib/friendPresence.ts"
      - ".github/workflows/social-db.yml"
      - "package.json"

jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local
      - name: Lint local database schema
        run: supabase db lint --local --level warning --fail-on error
      - name: Run local Supabase advisors
        run: supabase db advisors --local --type all --level warn --fail-on error
      - name: Verify narrow social Realtime publication
        run: supabase db query --local --file scripts/testSocialPublication.sql
      - name: Test friend profile projection and exact XP levels
        run: |
          docker exec -i supabase_db_contree-kffr psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/testFriendProfile.sql
          npx vite-node --config vitest.config.ts scripts/testFriendProfileFormula.ts
      - name: Test social RLS with local Auth JWTs
        shell: bash
        run: |
          set -a
          source <(supabase status -o env \
            --override-name api.url=SOCIAL_TEST_SUPABASE_URL \
            --override-name auth.anon_key=SOCIAL_TEST_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SOCIAL_TEST_SUPABASE_SERVICE_ROLE_KEY \
            | grep '^SOCIAL_TEST_')
          set +a
          npm run test:db:social
      - name: Provision disposable local browser accounts
        shell: bash
        run: |
          set -a
          source <(supabase status -o env \
            --override-name api.url=SOCIAL_TEST_SUPABASE_URL \
            --override-name auth.anon_key=SOCIAL_TEST_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SOCIAL_TEST_SUPABASE_SERVICE_ROLE_KEY \
            | grep '^SOCIAL_TEST_')
          set +a
          node scripts/provisionSocialE2e.mjs
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\nSUPABASE_SECRET_KEY=%s\n' "$SOCIAL_TEST_SUPABASE_URL" "$SOCIAL_TEST_SUPABASE_ANON_KEY" "$SOCIAL_TEST_SUPABASE_SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test global social notifications with two browsers
        run: npx playwright test --project=social
        env:
          E2E_PRODUCTION_SERVER: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: social-playwright-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 3
