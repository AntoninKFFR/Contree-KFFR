name: Expo iOS foundation

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/expo-mobile.yml"
  push:
    branches: [main, feat/142-expo-go-foundation]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/expo-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  expo-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: "1"
      # Export checks compilation only; it never connects to production Supabase.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo install --check
      - run: npx expo-doctor
      - run: npm run export:ios
