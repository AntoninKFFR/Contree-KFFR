name: Expo iOS foundation

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "engine/**"
      - "lib/preferences/**"
      - "lib/solo/**"
      - "lib/soloBotPacing.ts"
      - "lib/soloLastTrick.ts"
      - "lib/trickPresentation.ts"
      - ".github/workflows/expo-mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "engine/**"
      - "lib/preferences/**"
      - "lib/solo/**"
      - "lib/soloBotPacing.ts"
      - "lib/soloLastTrick.ts"
      - "lib/trickPresentation.ts"
      - ".github/workflows/expo-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  expo-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: "1"
      # Export checks compilation only; it never connects to production Supabase.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install locked Expo SDK 57 dependencies
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Verify generated native iOS orientation and development profiles
        run: npm run native:check
      - name: Generate iOS project sources without compiling or signing
        run: npx expo prebuild --platform ios --no-install
      - name: Verify generated Info.plist and iPhone Xcode targets
        run: |
          python3 - <<'PY'
          import pathlib, plistlib, re
          root = pathlib.Path('ios')
          files = list(root.glob('*/Info.plist'))
          assert len(files) == 1, 'Expected exactly one app Info.plist'
          plist = plistlib.loads(files[0].read_bytes())
          expected = {'UIInterfaceOrientationLandscapeLeft', 'UIInterfaceOrientationLandscapeRight'}
          for key in ('UISupportedInterfaceOrientations', 'UISupportedInterfaceOrientations~ipad'):
              values = plist[key]
              assert len(values) == 2 and set(values) == expected, key
          assert plist['EXDefaultScreenOrientationMask'] == 'UIInterfaceOrientationMaskLandscape'
          assert plist['UIRequiresFullScreen'] is True
          assert 'UIRequiresFullScreenIgnoredStartingWithVersion' not in plist
          assert plist.get('UILaunchStoryboardName'), 'Native launch screen required'
          scenes = plist['UIApplicationSceneManifest']
          assert scenes['UIApplicationSupportsMultipleScenes'] is False
          assert scenes['UISceneConfigurations']['UIWindowSceneSessionRoleApplication'][0]['UISceneDelegateClassName'] == 'EXExpoAppSceneDelegate'
          delegate = files[0].with_name('AppDelegate.swift').read_text()
          assert 'ExpoReactNativeFactoryProvider' in delegate, 'Scene factory provider missing'
          assert 'factory.startReactNative(' not in delegate, 'Legacy startup must move to the scene delegate'
          projects = list(root.glob('*.xcodeproj/project.pbxproj'))
          assert len(projects) == 1, 'Expected exactly one Xcode project'
          project = projects[0].read_text()
          families = re.findall(r'TARGETED_DEVICE_FAMILY = ([^;]+);', project)
          assert families and all(value.strip('"') == '1' for value in families), 'iPhone targets only'
          assert 'com.antoninkffr.kffrcontree.dev' in project, 'Development bundle identifier missing'
          print('Generated native files verified: landscape pair, initial landscape, game full-screen preference, launch screen, scene startup, iPhone targets. This is not a compiled or signed binary.')
          PY
      - name: Upload generated native project for review
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-configuration
          path: apps/mobile/ios
          if-no-files-found: error
      - name: Test account lifecycle, native navigation and network handling
        run: npm test
      - name: Install browser for landscape component geometry checks
        run: npx playwright install --with-deps chromium
      - name: Verify landscape geometry and capture test screens
        run: npm run test:geometry
      - name: Upload landscape geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-landscape-geometry
          path: |
            apps/mobile/geometry-results
            apps/mobile/geometry-report
            apps/mobile/docs/parity-150/captures
          if-no-files-found: warn
      - name: Check Expo Go SDK 57 package compatibility
        run: npx expo install --check
      - name: Run Expo Doctor
        run: npx expo-doctor
      - name: Export the iOS bundle
        run: npm run export:ios -- --source-maps
      - name: Verify the actual native Metro module graph
        run: npm run bundle:check

  solo-web-native-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Capture the actual web Solo at four states and three sizes
        run: npx playwright test --config playwright.solo-parity.config.ts
        env:
          E2E_PRODUCTION_SERVER: "1"
      - name: Compare actual React Native Web components against the same public states
        run: npm run test:geometry -- --grep parity
        working-directory: apps/mobile
      - name: Assemble comparison boards from the captured source images
        run: node scripts/render-solo-comparison.mjs
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solo-web-native-parity
          path: |
            apps/mobile/docs/parity-150/captures
            apps/mobile/geometry-results
            apps/mobile/geometry-report
            test-results
          if-no-files-found: error
