name: Training DB security

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "app/api/training/duo/**"
      - "lib/server/trainingDuo*"
      - "lib/trainingDuoInvitationsApi.ts"
      - "scripts/testTrainingDb.mjs"
      - "scripts/testTrainingDuoDb.mjs"
      - "scripts/testTrainingDuoRateLimitSchema.sql"
      - ".github/workflows/training-db.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "app/api/training/duo/**"
      - "lib/server/trainingDuo*"
      - "lib/trainingDuoInvitationsApi.ts"
      - "scripts/testTrainingDb.mjs"
      - "scripts/testTrainingDuoDb.mjs"
      - "scripts/testTrainingDuoRateLimitSchema.sql"
      - ".github/workflows/training-db.yml"
      - "package.json"

jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local
      - name: Verify duo rate limit grants and publication
        run: supabase db query --local --file scripts/testTrainingDuoRateLimitSchema.sql
      - name: Lint local database schema
        run: supabase db lint --local --level warning --fail-on error
      - name: Run local Supabase advisors
        run: supabase db advisors --local --type all --level warn --fail-on error
      - name: Test training records with local Auth JWTs
        shell: bash
        run: |
          set -a
          source <(supabase status -o env \
            --override-name api.url=TRAINING_TEST_SUPABASE_URL \
            --override-name auth.anon_key=TRAINING_TEST_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=TRAINING_TEST_SUPABASE_SERVICE_ROLE_KEY \
            | grep '^TRAINING_TEST_')
          set +a
          npm run test:db:training
      - name: Test training duo with local Auth JWTs
        shell: bash
        run: |
          set -a
          source <(supabase status -o env \
            --override-name api.url=DUO_TEST_SUPABASE_URL \
            --override-name auth.anon_key=DUO_TEST_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=DUO_TEST_SUPABASE_SERVICE_ROLE_KEY \
            | grep '^DUO_TEST_')
          set +a
          npm run test:db:training-duo
