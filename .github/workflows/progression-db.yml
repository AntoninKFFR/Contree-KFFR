name: Progression foundations

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "lib/progression/**"
      - "lib/profileCosmetics.ts"
      - "lib/solo/**"
      - "lib/server/solo*"
      - "lib/server/progressionService.ts"
      - "lib/server/progressionReadiness.ts"
      - "lib/server/multiplayerService.ts"
      - "app/api/solo/**"
      - "app/solo/**"
      - "tests/solo*"
      - "tests/progression*"
      - "scripts/testProgression*"
      - ".github/workflows/progression-db.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "lib/progression/**"
      - "lib/profileCosmetics.ts"
      - "lib/solo/**"
      - "lib/server/solo*"
      - "lib/server/progressionService.ts"
      - "lib/server/progressionReadiness.ts"
      - "lib/server/multiplayerService.ts"
      - "app/api/solo/**"
      - "app/solo/**"
      - "tests/solo*"
      - "tests/progression*"
      - "scripts/testProgression*"
      - ".github/workflows/progression-db.yml"
      - "package.json"

jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- tests/progressionFormulaV1.test.ts tests/progressionQueries.test.ts tests/progressionFinish.test.ts tests/soloAuthority.test.ts tests/soloRoutes.test.ts tests/soloSessionLoop.test.ts tests/progressionReadiness.test.ts tests/progressionRollout.test.ts tests/progressionWeekly.test.tsx tests/progressionProvider.test.tsx tests/progressionCosmetics.test.tsx tests/profilePage.test.ts tests/progressionNav.test.tsx
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local --version 20260930200000
      - name: Seed pre-missions history and a pending Game XP job
        run: docker exec -i supabase_db_contree-kffr psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/testProgressionMissionsBefore.sql
      - run: supabase migration up --local
      - name: Verify real migration has no retroactive mission rewards
        run: docker exec -i supabase_db_contree-kffr psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/testProgressionMissionsAfter.sql
      - run: supabase db reset --local --version 20261001000000
      - name: Seed pre-weekly verified history and a permanent-eligible pending job
        run: docker exec -i supabase_db_contree-kffr psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/testProgressionWeeklyBefore.sql
      - run: supabase migration up --local
      - name: Verify weekly activation has no backfill and preserves permanent eligibility
        run: docker exec -i supabase_db_contree-kffr psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/testProgressionWeeklyAfter.sql
      - run: supabase db reset --local --version 20261001010000
      - name: Seed authoritative XP balances before cosmetic migration
        run: docker exec -i supabase_db_contree-kffr psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/testProgressionCosmeticsBefore.sql
      - run: supabase migration up --local
      - name: Verify cosmetic backfill and empty equipment
        run: docker exec -i supabase_db_contree-kffr psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/testProgressionCosmeticsAfter.sql
      - run: supabase db query --local --file scripts/testProgressionSchema.sql
      - name: Test game rewards, privileges and transactional recovery
        run: docker exec -i supabase_db_contree-kffr psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/testProgressionGameSchema.sql
      - name: Test permanent missions and transactional rollback
        run: docker exec -i supabase_db_contree-kffr psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/testProgressionMissionsSchema.sql
      - name: Test weekly catalog, Paris/DST, events, caps and atomic rewards
        run: docker exec -i supabase_db_contree-kffr psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/testProgressionWeeklySchema.sql
      - name: Test cosmetic thresholds, equipment permissions and atomic unlocks
        run: docker exec -i supabase_db_contree-kffr psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/testProgressionCosmeticsSchema.sql
      - name: Test unlocked-only surprise reads and legacy compatibility
        run: docker exec -i supabase_db_contree-kffr psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/testProgressionCosmeticsSurprise.sql
      - run: node scripts/testProgressionWeeklyConcurrency.mjs
      - run: supabase db lint --local --level warning --fail-on error
      - run: supabase db advisors --local --type all --level warn --fail-on error
      - name: Test XP foundations with local Auth JWTs
        shell: bash
        run: |
          set -a
          source <(supabase status -o env \
            --override-name api.url=PROGRESSION_TEST_SUPABASE_URL \
            --override-name auth.anon_key=PROGRESSION_TEST_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=PROGRESSION_TEST_SUPABASE_SERVICE_ROLE_KEY \
            | grep '^PROGRESSION_TEST_')
          set +a
          npm run test:db:progression
      - name: Test actual game XP through local Next and Supabase
        shell: bash
        run: |
          set -a
          source <(supabase status -o env \
            --override-name api.url=PROGRESSION_TEST_SUPABASE_URL \
            --override-name auth.anon_key=PROGRESSION_TEST_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=PROGRESSION_TEST_SUPABASE_SERVICE_ROLE_KEY \
            | grep '^PROGRESSION_TEST_')
          export NEXT_PUBLIC_SUPABASE_URL="$PROGRESSION_TEST_SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PROGRESSION_TEST_SUPABASE_ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$PROGRESSION_TEST_SUPABASE_SERVICE_ROLE_KEY"
          set +a
          npx playwright install --with-deps chromium
          npm run build
          npm run start -- --hostname 127.0.0.1 > /tmp/progression-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/solo > /dev/null; then break; fi
            sleep 1
          done
          npm run test:db:progression-games
          npx vite-node --config vitest.config.ts scripts/testProgressionMissionsDb.ts
          npx vite-node --config vitest.config.ts scripts/testProgressionWeeklyDb.ts
          npx vite-node --config vitest.config.ts scripts/testProgressionCosmeticsDb.ts
