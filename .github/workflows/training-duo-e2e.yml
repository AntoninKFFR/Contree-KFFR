name: Training duo E2E

on:
  pull_request:
    paths:
      - "app/training/duo/**"
      - "app/api/training/duo/**"
      - "components/training/**"
      - "lib/trainingDuo*"
      - "lib/server/trainingDuo*"
      - "engine/training/bidReading*"
      - "e2e/trainingDuo*"
      - "e2e/helpers/**"
      - "scripts/provisionTrainingDuoE2E.mjs"
      - "supabase/migrations/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/training-duo-e2e.yml"
  push:
    branches: [main]
    paths:
      - "app/training/duo/**"
      - "app/api/training/duo/**"
      - "components/training/**"
      - "lib/trainingDuo*"
      - "lib/server/trainingDuo*"
      - "engine/training/bidReading*"
      - "e2e/trainingDuo*"
      - "e2e/helpers/**"
      - "scripts/provisionTrainingDuoE2E.mjs"
      - "supabase/migrations/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/training-duo-e2e.yml"

jobs:
  authenticated-duo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local
      - name: Export local Supabase configuration
        shell: bash
        run: |
          set -a
          source <(supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_|SUPABASE_SERVICE_ROLE_KEY)')
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Provision two disposable authenticated users
        run: node scripts/provisionTrainingDuoE2E.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Exercise authenticated duo in two browser contexts
        run: npm run test:e2e:training-duo
        env:
          E2E_PRODUCTION_SERVER: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: training-duo-playwright-report
          path: playwright-report/
          retention-days: 7
