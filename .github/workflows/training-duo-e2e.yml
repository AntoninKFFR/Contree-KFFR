name: Training duo E2E

on:
  pull_request:
    paths:
      # Final Mobile/PWA QA must retain the real server guarantees.
      - "e2e/mobilePwaFinalQa.spec.ts"
      - "e2e/helpers/mobilePwaFinalQa.ts"
      - "scripts/collectMobilePwaQa.mjs"
      - "app/training/duo/**"
      - "app/api/training/duo/**"
      - "components/training/**"
      - "lib/trainingDuo*"
      - "lib/training/**"
      - "apps/mobile/src/training/**"
      - "scripts/testNativeTrainingLocal.ts"
      - "scripts/testNativeTrainingUiLocal.ts"
      - "apps/mobile/tests/visual/**"
      - "lib/server/trainingDuo*"
      - "engine/training/bidReading*"
      - "e2e/trainingDuo*"
      - "e2e/helpers/**"
      - "scripts/provisionTrainingDuoE2E.mjs"
      - "docs/training-duo-network-spec.md"
      - "docs/PRD-entrainement.md"
      - "reports/training-duo-l3.md"
      - "supabase/migrations/**"
      - "app/friends/**"
      - "components/friends/**"
      - "components/social/**"
      - "lib/socialNotifications.ts"
      - "e2e/socialNotifications.spec.ts"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/training-duo-e2e.yml"
  push:
    branches: [main]
    paths:
      - "e2e/mobilePwaFinalQa.spec.ts"
      - "e2e/helpers/mobilePwaFinalQa.ts"
      - "scripts/collectMobilePwaQa.mjs"
      - "app/training/duo/**"
      - "app/api/training/duo/**"
      - "components/training/**"
      - "lib/trainingDuo*"
      - "lib/training/**"
      - "apps/mobile/src/training/**"
      - "scripts/testNativeTrainingLocal.ts"
      - "scripts/testNativeTrainingUiLocal.ts"
      - "apps/mobile/tests/visual/**"
      - "lib/server/trainingDuo*"
      - "engine/training/bidReading*"
      - "e2e/trainingDuo*"
      - "e2e/helpers/**"
      - "scripts/provisionTrainingDuoE2E.mjs"
      - "docs/training-duo-network-spec.md"
      - "docs/PRD-entrainement.md"
      - "reports/training-duo-l3.md"
      - "supabase/migrations/**"
      - "app/friends/**"
      - "components/friends/**"
      - "components/social/**"
      - "lib/socialNotifications.ts"
      - "e2e/socialNotifications.spec.ts"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/training-duo-e2e.yml"

jobs:
  authenticated-duo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local
      - name: Export local Supabase configuration
        shell: bash
        run: |
          set -a
          source <(supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_|SUPABASE_SERVICE_ROLE_KEY)')
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Provision two disposable authenticated users
        run: node scripts/provisionTrainingDuoE2E.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Exercise authenticated duo in two browser contexts
        run: npm run test:e2e:training-duo
        env:
          E2E_PRODUCTION_SERVER: "1"
          E2E_REQUIRE_TRAINING_DUO_AUTH: "1"
      - name: Install the actual native SDK for cross-platform training controllers
        run: npm ci --prefix apps/mobile
      - name: Verify native/web training records and Duo on the disposable local backend
        shell: bash
        run: |
          node -e 'require("node:fs").writeFileSync("/tmp/native-training-local.json", JSON.stringify({API_URL:process.env.NEXT_PUBLIC_SUPABASE_URL,ANON_KEY:process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,SERVICE_ROLE_KEY:process.env.SUPABASE_SERVICE_ROLE_KEY}))'
          npm run start -- --hostname 127.0.0.1 --port 3007 > /tmp/native-training-next.log 2>&1 &
          server_pid=$!
          (cd apps/mobile && node scripts/serve-visual-tests.mjs) > /tmp/native-training-visual.log 2>&1 &
          visual_pid=$!
          trap 'kill "$server_pid" "$visual_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3007/training > /dev/null; then break; fi
            sleep 1
          done
          NATIVE_TRAINING_LOCAL_CONFIG=/tmp/native-training-local.json npx vite-node --config vitest.config.ts scripts/testNativeTrainingLocal.ts
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8091 > /dev/null; then break; fi
            sleep 1
          done
          NATIVE_TRAINING_LOCAL_CONFIG=/tmp/native-training-local.json npx vite-node --config vitest.config.ts scripts/testNativeTrainingUiLocal.ts
      - name: Upload native training integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-training-local-integration
          path: |
            apps/mobile/docs/training-153/local-integration.json
            apps/mobile/docs/training-153/ui-local-integration.json
            apps/mobile/docs/training-153/captures/duo-*.png
            apps/mobile/docs/training-153/captures/native-game-*-844.png
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: training-duo-playwright-report
          path: playwright-report/
          retention-days: 7
